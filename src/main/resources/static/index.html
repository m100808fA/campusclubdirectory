<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab – Club Directory</title>

  <style>

        h1 {
            color: green;
        }

        #message {
            color: red;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        label {
            font-weight: bold;
        }

        #clubs li {
            margin-bottom: 8px;
        }

    </style>

</head>
<body>

<h1>Campus Club Directory</h1>

<!-- Clubs come from /api/clubs -->
<ul id="clubs"></ul>

<h2>Add a club</h2>

<form id="clubForm" novalidate>
  <div>
    <input type="text" id="name" placeholder="Club name" required>
  </div>
  <div>
    <input type="text" id="category" placeholder="Category" required>
  </div>
  <div>
    <input type="text" id="meetingDay" placeholder="Meeting Day" required>
  </div>
  <div>
    <input type="text" id="room" placeholder="Room (optional)">
  </div>
    <button type="submit">Add Club</button>
</form>

<p id="message"></p>

<script>

  async function loadClubs() {

    const clubs = await fetch("/api/clubs").then(r => r.json());

    const list = document.getElementById("clubs");

    list.innerHTML = "";

    for (const club of clubs) {

      const li = document.createElement("li");

      li.textContent = club.name + " – " + club.category + ", " + club.meetingDay

                       + (club.room ? ", " + club.room : "");

      list.appendChild(li);

    }

  }



  document.getElementById("clubForm").addEventListener("submit", async event => {

    event.preventDefault();

    const club = {

      name: document.getElementById("name").value,

      category: document.getElementById("category").value,

      meetingDay: document.getElementById("meetingDay").value,

      room: document.getElementById("room").value

    };

    const response = await fetch("/api/clubs", {

      method: "POST",

      headers: { "Content-Type": "application/json" },

      body: JSON.stringify(club)

    });

    if (response.ok) {

      event.target.reset();

      document.getElementById("message").textContent = "";

      loadClubs();

    } else {

      document.getElementById("message").textContent =

          "Please fill in name, category and meeting day.";

    }

  });



  loadClubs();

</script>

</body>
</html>
